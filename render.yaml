services:
  # Spring Boot Web Service (Dev)
  - type: web
    name: springboot-app-dev
    runtime: docker
    plan: free # Free instance for testing/dev
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_VERSION
        value: "25" # 
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_HOST
        fromDatabase:
          name: app-postgres-dev
          property: host
      - key: DB_PORT
        fromDatabase:
          name: app-postgres-dev
          property: port
      - key: DB_NAME
        fromDatabase:
          name: app-postgres-dev
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: app-postgres-dev
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: app-postgres-dev
          property: password

      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: redis
          name: app-redis-dev
          property: host

      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: redis
          name: app-redis-dev
          property: port          

  # Managed Redis (Starter tier is the smallest on Render)
  - type: redis
    name: app-redis-dev
    plan: starter
    ipAllowList: [] # Private internal network only

# Managed PostgreSQL Database
databases:
  - name: app-postgres-dev
    plan: free # Free tier database for dev (expires after 30 days)
    databaseName: devdb
    user: devuser
    ipAllowList: []